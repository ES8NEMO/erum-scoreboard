<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>QR Codes - Tableau des Médailles</title>

  <link rel="stylesheet" href="./style.css" />

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>

<body>

  <div class="qr-page">

    <div class="qr-container">

      <h1>Tableau des Médailles</h1>

      <p class="qr-subtitle">
        Scannez le QR code pour accéder au tableau
      </p>

      <div class="qr-grid">

        <!-- PUBLIC TABLE -->
        <div class="qr-card">

          <h2>📊 Tableau public</h2>

          <p>
            Accès pour les travailleurs et visiteurs
          </p>

          <div
            id="publicQr"
            class="qr-code">
          </div>

          <div class="qr-link">
            <a
              id="publicLink"
              href="#"
              target="_blank"
              rel="noopener">
              Ouvrir le tableau
            </a>
          </div>

        </div>


        <!-- ADMIN -->
        <div class="qr-card">

          <h2>🔐 Administration</h2>

          <p>
            Accès réservé à l'administrateur
          </p>

          <div
            id="adminQr"
            class="qr-code">
          </div>

          <div class="qr-link">
            <a
              id="adminLink"
              href="#"
              target="_blank"
              rel="noopener">
              Ouvrir l'administration
            </a>
          </div>

        </div>

      </div>

    </div>

  </div>


  <script>

    /*
      This page automatically detects its current location.

      Example:
      https://your-project.pages.dev/qr.html

      It will automatically generate:

      Public:
      https://your-project.pages.dev/index.html

      Admin:
      https://your-project.pages.dev/admin.html
    */

    const currentUrl =
      window.location.href.substring(
        0,
        window.location.href.lastIndexOf("/") + 1
      );


    const publicUrl =
      currentUrl + "index.html";

    const adminUrl =
      currentUrl + "admin.html";


    // Display links
    document.getElementById("publicLink").href =
      publicUrl;

    document.getElementById("publicLink").textContent =
      publicUrl;


    document.getElementById("adminLink").href =
      adminUrl;

    document.getElementById("adminLink").textContent =
      adminUrl;


    // Generate public QR
    new QRCode(
      document.getElementById("publicQr"),
      {
        text: publicUrl,
        width: 220,
        height: 220,
        correctLevel: QRCode.CorrectLevel.H
      }
    );


    // Generate admin QR
    new QRCode(
      document.getElementById("adminQr"),
      {
        text: adminUrl,
        width: 220,
        height: 220,
        correctLevel: QRCode.CorrectLevel.H
      }
    );

  </script>

</body>
</html>
