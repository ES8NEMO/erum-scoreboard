<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Générer les QR Codes</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Inter', system-ui, sans-serif; background:#F4F5F3; color:#1E2320; padding: 16px 12px 50px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .panel { background:#fff; border:1px solid #DADAD6; border-radius:10px; padding:18px; margin-bottom:14px; text-align:center; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
  .panel p.url { font-size: 11px; color:#5B615C; word-break: break-all; margin: 6px 0 12px; direction: ltr; }
  .qr-box { display:inline-block; background:#fff; padding:8px; border-radius:8px; }
  .footer-note { text-align:center; font-size:12px; color:#5B615C; margin-top: 10px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🏅 Générer les QR Codes</h1>
    <div class="panel">
      <h2 style="font-size:16px;">📱 QR — Vue équipe (lecture seule)</h2>
      <p class="url" id="viewerUrl"></p>
      <div class="qr-box" id="qrViewer"></div>
    </div>
    <div class="panel">
      <h2 style="font-size:16px;">🔧 QR — Admin (connexion)</h2>
      <p class="url" id="adminUrl"></p>
      <div class="qr-box" id="qrAdmin"></div>
    </div>
    <div class="footer-note">Le QR admin ouvre uniquement la page de connexion — ne partagez pas vos identifiants.</div>
  </div>
  <script>
    const base = window.location.href.replace(/qr\.html.*$/, "");
    const viewerUrl = base + "index.html";
    const adminUrl = base + "admin.html";
    document.getElementById("viewerUrl").textContent = viewerUrl;
    document.getElementById("adminUrl").textContent = adminUrl;
    new QRCode(document.getElementById("qrViewer"), { text: viewerUrl, width: 190, height: 190 });
    new QRCode(document.getElementById("qrAdmin"), { text: adminUrl, width: 190, height: 190 });
  </script>
</body>
</html>
