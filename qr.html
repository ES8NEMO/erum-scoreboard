<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>توليد QR Codes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  .qr-panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; text-align: center; }
  .qr-panel h2 { font-family: 'Bebas Neue', sans-serif; font-size: 20px; margin: 0 0 4px; }
  .qr-panel p.url { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); word-break: break-all; margin: 4px 0 14px; direction: ltr; }
  .qr-box { display: inline-block; background: #fff; padding: 10px; border-radius: 8px; }
  .keybox { display:flex; gap:8px; margin-bottom: 18px; }
  .keybox input { flex:1; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 10px 12px; font-family: inherit; }
  .keybox input:focus { outline:none; border-color: var(--accent-2); }
</style>
</head>
<body>
  <div class="wrap" style="max-width:520px;">
    <div class="topbar">
      <div class="brand">
        <span class="eyebrow">SETUP</span>
        <h1>توليد الأكواد</h1>
      </div>
    </div>

    <div class="qr-panel">
      <p style="color:var(--text-dim); font-size:13px;">دخل هنا المفتاح السري ديال الأدمين (ADMIN_KEY لي حطيتي فـ firebase-config.js) باش يتولد ليك رابط الأدمين الصحيح:</p>
      <div class="keybox">
        <input type="text" id="keyInput" placeholder="admin key..." />
      </div>
    </div>

    <div class="qr-panel">
      <h2>📱 QR ديال العمال (فيوور فقط)</h2>
      <p class="url" id="viewerUrl"></p>
      <div class="qr-box" id="qrViewer"></div>
    </div>

    <div class="qr-panel">
      <h2>🔧 QR ديال الأدمين (نتا)</h2>
      <p class="url" id="adminUrl"></p>
      <div class="qr-box" id="qrAdmin"></div>
    </div>

    <div class="footer-note">حتفظ بصورة كل QR فتيليفونك — القراصنة ديال الأدمين ماشي للتوزيع!</div>
  </div>

  <script>
    const base = window.location.href.replace(/qr\.html.*$/, "");
    const viewerUrl = base + "index.html";
    const keyInput = document.getElementById("keyInput");
    const adminUrlEl = document.getElementById("adminUrl");
    document.getElementById("viewerUrl").textContent = viewerUrl;

    let qrViewer = new QRCode(document.getElementById("qrViewer"), { text: viewerUrl, width: 200, height: 200 });
    let qrAdmin = null;

    function renderAdminQR() {
      const key = keyInput.value.trim();
      const adminUrl = base + "admin.html" + (key ? "?key=" + encodeURIComponent(key) : "");
      adminUrlEl.textContent = key ? adminUrl : "دخل المفتاح السري باش يتولد الرابط...";
      document.getElementById("qrAdmin").innerHTML = "";
      if (key) {
        qrAdmin = new QRCode(document.getElementById("qrAdmin"), { text: adminUrl, width: 200, height: 200 });
      }
    }
    keyInput.addEventListener("input", renderAdminQR);
    renderAdminQR();
  </script>
</body>
</html>
