<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau des Médailles</title>

  <link rel="stylesheet" href="./style.css" />

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      initializeFirestore,
      persistentLocalCache,
      persistentSingleTabManager,
      doc,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    import { firebaseConfig, DOC_PATH } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);

    const db = initializeFirestore(app, {
      localCache: persistentLocalCache({
        tabManager: persistentSingleTabManager()
      })
    });

    const leaderboardRef = doc(
      db,
      DOC_PATH.collection,
      DOC_PATH.doc
    );

    const translations = {
      fr: {
        title: "TABLEAU DES MÉDAILLES",
        subtitle: "Performance des équipes",
        week: "SEMAINE",
        team: "ÉQUIPE",
        total: "TOTAL",
        variable: "VARIABLE",
        bmb: "BMB",
        engel: "ENGEL",
        trs: "TRS",
        valid: "Qualité / Validité",
        presence: "Présence",
        org: "Organisation",
        teamOfWeek: "ÉQUIPE DE LA SEMAINE",
        reward: "Récompense",
        noData: "Aucune donnée disponible",
        loading: "Chargement...",
        lastUpdate: "Dernière mise à jour",
        monday: "Lundi",
        sunday: "Dimanche",
        gold: "Or",
        silver: "Argent",
        bronze: "Bronze"
      },

      en: {
        title: "MEDAL BOARD",
        subtitle: "Team performance",
        week: "WEEK",
        team: "TEAM",
        total: "TOTAL",
        variable: "VARIABLE",
        bmb: "BMB",
        engel: "ENGEL",
        trs: "TRS",
        valid: "Quality / Validity",
        presence: "Attendance",
        org: "Organization",
        teamOfWeek: "TEAM OF THE WEEK",
        reward: "Reward",
        noData: "No data available",
        loading: "Loading...",
        lastUpdate: "Last update",
        monday: "Monday",
        sunday: "Sunday",
        gold: "Gold",
        silver: "Silver",
        bronze: "Bronze"
      },

      es: {
        title: "TABLERO DE MEDALLAS",
        subtitle: "Rendimiento de los equipos",
        week: "SEMANA",
        team: "EQUIPO",
        total: "TOTAL",
        variable: "VARIABLE",
        bmb: "BMB",
        engel: "ENGEL",
        trs: "TRS",
        valid: "Calidad / Validez",
        presence: "Asistencia",
        org: "Organización",
        teamOfWeek: "EQUIPO DE LA SEMANA",
        reward: "Recompensa",
        noData: "No hay datos disponibles",
        loading: "Cargando...",
        lastUpdate: "Última actualización",
        monday: "Lunes",
        sunday: "Domingo",
        gold: "Oro",
        silver: "Plata",
        bronze: "Bronce"
      }
    };

    let currentLanguage = "fr";
    let currentData = null;

    const teams = ["A", "B", "C", "D"];

    const zones = [
      {
        id: "VARIABLE",
        defaultName: "VARIABLE"
      },
      {
        id: "BMB",
        defaultName: "BMB"
      },
      {
        id: "ENGEL",
        defaultName: "ENGEL"
      }
    ];

    const criteria = [
      {
        id: "trs",
        defaultName: "TRS"
      },
      {
        id: "valid",
        defaultName: "Qualité / Validité"
      },
      {
        id: "presence",
        defaultName: "Présence"
      },
      {
        id: "org",
        defaultName: "Organisation"
      }
    ];

    function t(key) {
      return translations[currentLanguage]?.[key] || translations.fr[key] || key;
    }

    function getValue(obj, path, fallback = 0) {
      const parts = path.split(".");
      let value = obj;

      for (const part of parts) {
        if (value == null) return fallback;
        value = value[part];
      }

      return value ?? fallback;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalizeData(data) {
      const normalized = data || {};

      if (!normalized.teams) {
        normalized.teams = {};
      }

      teams.forEach(team => {
        if (!normalized.teams[team]) {
          normalized.teams[team] = {};
        }

        if (!normalized.teams[team].zones) {
          normalized.teams[team].zones = {};
        }

        zones.forEach(zone => {
          if (!normalized.teams[team].zones[zone.id]) {
            normalized.teams[team].zones[zone.id] = {
              gold: 0,
              silver: 0,
              bronze: 0
            };
          }
        });

        if (!normalized.teams[team].criteria) {
          normalized.teams[team].criteria = {};
        }

        criteria.forEach(criterion => {
          if (
            typeof normalized.teams[team].criteria[criterion.id] !==
            "number"
          ) {
            normalized.teams[team].criteria[criterion.id] = 0;
          }
        });
      });

      if (!normalized.labels) {
        normalized.labels = {};
      }

      if (!normalized.week) {
        normalized.week = {};
      }

      if (!normalized.teamOfWeek) {
        normalized.teamOfWeek = {};
      }

      return normalized;
    }

    function medalTotal(teamData) {
      let total = 0;

      zones.forEach(zone => {
        total += Number(
          getValue(teamData, `zones.${zone.id}.gold`, 0)
        );

        total += Number(
          getValue(teamData, `zones.${zone.id}.silver`, 0)
        );

        total += Number(
          getValue(teamData, `zones.${zone.id}.bronze`, 0)
        );
      });

      return total;
    }

    function getTeamRankings(data) {
      return teams
        .map(team => ({
          team,
          total: medalTotal(data.teams?.[team] || {})
        }))
        .sort((a, b) => {
          if (b.total !== a.total) {
            return b.total - a.total;
          }

          return a.team.localeCompare(b.team);
        });
    }

    function medalIcon(type) {
      if (type === "gold") return "🥇";
      if (type === "silver") return "🥈";
      if (type === "bronze") return "🥉";
      return "";
    }

    function renderMedalCell(teamData, zoneId, medalType) {
      const value = Number(
        getValue(
          teamData,
          `zones.${zoneId}.${medalType}`,
          0
        )
      );

      return `
        <div class="medal-value">
          <span class="medal-icon">${medalIcon(medalType)}</span>
          <span>${value}</span>
        </div>
      `;
    }

    function renderZoneCard(zone, data) {
      const label =
        data.labels?.zones?.[zone.id] ||
        zone.defaultName;

      return `
        <div class="zone-card">
          <div class="zone-title">
            ${escapeHtml(label)}
          </div>

          <div class="zone-table">
            <div class="zone-header">
              <div>${t("team")}</div>
              <div>${t("gold")}</div>
              <div>${t("silver")}</div>
              <div>${t("bronze")}</div>
              <div>${t("total")}</div>
            </div>

            ${teams.map(team => {
              const teamData = data.teams?.[team] || {};

              const gold = Number(
                getValue(
                  teamData,
                  `zones.${zone.id}.gold`,
                  0
                )
              );

              const silver = Number(
                getValue(
                  teamData,
                  `zones.${zone.id}.silver`,
                  0
                )
              );

              const bronze = Number(
                getValue(
                  teamData,
                  `zones.${zone.id}.bronze`,
                  0
                )
              );

              const total = gold + silver + bronze;

              return `
                <div class="zone-row">
                  <div class="team-name">
                    ${escapeHtml(team)}
                  </div>

                  <div>${renderMedalCell(
                    teamData,
                    zone.id,
                    "gold"
                  )}</div>

                  <div>${renderMedalCell(
                    teamData,
                    zone.id,
                    "silver"
                  )}</div>

                  <div>${renderMedalCell(
                    teamData,
                    zone.id,
                    "bronze"
                  )}</div>

                  <div class="zone-total">
                    ${total}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function renderCriteriaTable(data) {
      return `
        <div class="criteria-card">

          <div class="criteria-title">
            ${t("total")}
          </div>

          <div class="criteria-table">

            <div class="criteria-header">
              <div>${t("team")}</div>

              ${criteria.map(criterion => {
                const label =
                  data.labels?.criteria?.[criterion.id] ||
                  criterion.defaultName;

                return `
                  <div>
                    ${escapeHtml(label)}
                  </div>
                `;
              }).join("")}

              <div>${t("total")}</div>
            </div>

            ${teams.map(team => {
              const teamData = data.teams?.[team] || {};

              let total = 0;

              const values = criteria.map(criterion => {
                const value = Number(
                  getValue(
                    teamData,
                    `criteria.${criterion.id}`,
                    0
                  )
                );

                total += value;

                return value;
              });

              return `
                <div class="criteria-row">

                  <div class="team-name">
                    ${escapeHtml(team)}
                  </div>

                  ${values.map(value => `
                    <div class="criteria-value">
                      ${value}
                    </div>
                  `).join("")}

                  <div class="criteria-total">
                    ${total}
                  </div>

                </div>
              `;
            }).join("")}

          </div>
        </div>
      `;
    }

    function renderRanking(data) {
      const rankings = getTeamRankings(data);

      return `
        <div class="ranking-card">

          <div class="ranking-title">
            🏆 ${t("total")}
          </div>

          <div class="ranking-list">

            ${rankings.map((item, index) => `
              <div class="ranking-item">

                <div class="ranking-position">
                  ${index + 1}
                </div>

                <div class="ranking-team">
                  ${t("team")} ${escapeHtml(item.team)}
                </div>

                <div class="ranking-score">
                  ${item.total}
                </div>

              </div>
            `).join("")}

          </div>

        </div>
      `;
    }

    function renderTeamOfWeek(data) {
      const team =
        data.teamOfWeek?.team ||
        data.teamOfWeek?.winner ||
        "";

      const reward =
        data.teamOfWeek?.reward ||
        "";

      if (!team) {
        return `
          <div class="team-week-card">

            <div class="team-week-title">
              🏆 ${t("teamOfWeek")}
            </div>

            <div class="team-week-empty">
              ${t("noData")}
            </div>

          </div>
        `;
      }

      return `
        <div class="team-week-card">

          <div class="team-week-title">
            🏆 ${t("teamOfWeek")}
          </div>

          <div class="team-week-winner">
            ${t("team")} ${escapeHtml(team)}
          </div>

          ${
            reward
              ? `
                <div class="team-week-reward">
                  <strong>${t("reward")}:</strong>
                  ${escapeHtml(reward)}
                </div>
              `
              : ""
          }

        </div>
      `;
    }

    function formatDate(dateValue) {
      if (!dateValue) return "";

      if (
        typeof dateValue === "object" &&
        dateValue.seconds
      ) {
        return new Date(
          dateValue.seconds * 1000
        ).toLocaleDateString();
      }

      const date = new Date(dateValue);

      if (Number.isNaN(date.getTime())) {
        return String(dateValue);
      }

      return date.toLocaleDateString();
    }

    function renderWeek(data) {
      const number =
        data.week?.number ||
        data.week?.weekNumber ||
        "";

      const start =
        data.week?.startDate ||
        "";

      const end =
        data.week?.endDate ||
        "";

      let html = "";

      if (number) {
        html += `
          <span class="week-number">
            ${t("week")} ${escapeHtml(number)}
          </span>
        `;
      }

      if (start || end) {
        html += `
          <span class="week-dates">
            ${
              start
                ? `${t("monday")}: ${escapeHtml(formatDate(start))}`
                : ""
            }

            ${
              start && end
                ? " — "
                : ""
            }

            ${
              end
                ? `${t("sunday")}: ${escapeHtml(formatDate(end))}`
                : ""
            }
          </span>
        `;
      }

      return html;
    }

    function render(data) {
      currentData = normalizeData(data);

      const appElement =
        document.getElementById("app");

      appElement.innerHTML = `
        <header class="top-header">

          <div class="header-content">

            <div>
              <h1>
                ${escapeHtml(
                  currentData.labels?.title ||
                  t("title")
                )}
              </h1>

              <p>
                ${escapeHtml(
                  currentData.labels?.subtitle ||
                  t("subtitle")
                )}
              </p>
            </div>

            <div class="language-switcher">

              <button
                class="${currentLanguage === "fr" ? "active" : ""}"
                data-lang="fr">
                FR
              </button>

              <button
                class="${currentLanguage === "en" ? "active" : ""}"
                data-lang="en">
                EN
              </button>

              <button
                class="${currentLanguage === "es" ? "active" : ""}"
                data-lang="es">
                ES
              </button>

            </div>

          </div>

        </header>

        <main class="main-container">

          <section class="week-section">

            <div class="week-info">
              ${renderWeek(currentData)}
            </div>

          </section>

          <section class="ranking-section">
            ${renderRanking(currentData)}
          </section>

          <section class="zones-section">

            ${zones.map(zone =>
              renderZoneCard(zone, currentData)
            ).join("")}

          </section>

          <section class="criteria-section">
            ${renderCriteriaTable(currentData)}
          </section>

          <section class="team-week-section">
            ${renderTeamOfWeek(currentData)}
          </section>

          <footer class="footer">

            <span>
              ${t("lastUpdate")}
            </span>

            <span id="last-update-value">
              ${new Date().toLocaleString()}
            </span>

          </footer>

        </main>
      `;

      document
        .querySelectorAll("[data-lang]")
        .forEach(button => {

          button.addEventListener("click", () => {

            currentLanguage =
              button.dataset.lang;

            render(currentData);

          });

        });
    }

    function showLoading() {
      document.getElementById("app").innerHTML = `
        <div class="loading-screen">
          <div class="loading-spinner"></div>
          <div>${t("loading")}</div>
        </div>
      `;
    }

    function showError(error) {
      console.error(error);

      document.getElementById("app").innerHTML = `
        <div class="error-screen">

          <h2>⚠️</h2>

          <p>
            ${t("noData")}
          </p>

          <small>
            ${escapeHtml(error?.message || "")}
          </small>

        </div>
      `;
    }

    showLoading();

    onSnapshot(
      leaderboardRef,
      snapshot => {

        if (snapshot.exists()) {
          render(snapshot.data());
        } else {
          render({});
        }

      },
      error => {
        showError(error);
      }
    );
  </script>
</head>

<body>

  <div id="app"></div>

</body>
</html>
