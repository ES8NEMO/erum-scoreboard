<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Tableau des Médailles</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <span class="status-line"><span class="live-dot"></span><span id="updated">—</span></span>
      <div class="lang-switch">
        <button class="gear-btn" id="gearBtn" title="Language / Langue / Idioma">⚙️</button>
        <div class="lang-menu" id="langMenu">
          <button data-lang="fr">🇫🇷 Français</button>
          <button data-lang="en">🇬🇧 English</button>
          <button data-lang="es">🇪🇸 Español</button>
        </div>
      </div>
    </div>

    <div class="medal-wrap">
      <table class="medal-table" id="medalTable"></table>
    </div>

    <div class="tow-panel">
      <div class="tow-head" data-i18n="equipeSemaine"></div>
      <div class="tow-body">
        <div class="tow-field"><label data-i18n="zone"></label><span class="static-value" id="towZone">—</span></div>
        <div class="tow-field"><label data-i18n="equipe"></label><span class="static-value" id="towEquipe">—</span></div>
        <div class="tow-field"><label data-i18n="total"></label><span class="static-value" id="towTotal">—</span></div>
        <div class="tow-field"><label data-i18n="recompense"></label><span class="static-value" id="towReward">—</span></div>
      </div>
    </div>

    <div class="legend-text" id="legendText"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { firebaseConfig, DOC_PATH } from "./firebase-config.js";

    // ---------- fixed structure (matches the client's template) ----------
    const ZONES = ["VARIABLE", "BMB", "ENGEL"];
    const TEAM_IDS = ["A", "B", "C", "D"];
    const CRITERIA = ["trs", "valid", "presence", "org"];
    const MAX_MEDALS = 5;

    const T = {
      fr: {
        semaine: "SEMAINE", du: "DU", au: "AU", criteres: "CRITÈRES",
        equipe: "Équipe", totalMedailles: "TOTAL MÉDAILLES",
        equipeSemaine: "ÉQUIPE DE LA SEMAINE", zone: "Zone :", recompense: "Récompense :",
        total: "Total :", medaillesWord: "médailles",
        crit_trs_t: "TRS ≥ 75 %", crit_trs_s: "Plus de 75 % = 1 médaille",
        crit_valid_t: "Validations machines", crit_valid_s: "Validation réussie = 1 médaille",
        crit_presence_t: "Présence / Assiduité", crit_presence_s: "Moins de 5 absences par équipe = 1 médaille",
        crit_org_t: "5S & Organisation", crit_org_s: "Zone conforme + 0 fiche AC = 1 médaille",
        legend: "Légende : chaque médaille est ajoutée par l'administrateur. Le total se calcule automatiquement.",
        updated: "Mis à jour : "
      },
      en: {
        semaine: "WEEK", du: "FROM", au: "TO", criteres: "CRITERIA",
        equipe: "Team", totalMedailles: "TOTAL MEDALS",
        equipeSemaine: "TEAM OF THE WEEK", zone: "Zone:", recompense: "Reward:",
        total: "Total:", medaillesWord: "medals",
        crit_trs_t: "OEE ≥ 75 %", crit_trs_s: "Over 75 % = 1 medal",
        crit_valid_t: "Machine validations", crit_valid_s: "Successful validation = 1 medal",
        crit_presence_t: "Attendance", crit_presence_s: "Fewer than 5 absences per team = 1 medal",
        crit_org_t: "5S & Organization", crit_org_s: "Compliant area + 0 non-conformity = 1 medal",
        legend: "Legend: each medal is added by the administrator. The total is calculated automatically.",
        updated: "Last updated: "
      },
      es: {
        semaine: "SEMANA", du: "DEL", au: "AL", criteres: "CRITERIOS",
        equipe: "Equipo", totalMedailles: "TOTAL MEDALLAS",
        equipeSemaine: "EQUIPO DE LA SEMANA", zone: "Zona:", recompense: "Recompensa:",
        total: "Total:", medaillesWord: "medallas",
        crit_trs_t: "TRS ≥ 75 %", crit_trs_s: "Más de 75 % = 1 medalla",
        crit_valid_t: "Validaciones de máquina", crit_valid_s: "Validación exitosa = 1 medalla",
        crit_presence_t: "Asistencia", crit_presence_s: "Menos de 5 ausencias por equipo = 1 medalla",
        crit_org_t: "5S y Organización", crit_org_s: "Zona conforme + 0 ficha AC = 1 medalla",
        legend: "Leyenda: cada medalla la añade el administrador. El total se calcula automáticamente.",
        updated: "Última actualización: "
      }
    };

    let lang = localStorage.getItem("lang") || "fr";

    const gearBtn = document.getElementById("gearBtn");
    const langMenu = document.getElementById("langMenu");
    gearBtn.addEventListener("click", () => langMenu.classList.toggle("open"));
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".lang-switch")) langMenu.classList.remove("open");
    });
    langMenu.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        lang = btn.dataset.lang;
        localStorage.setItem("lang", lang);
        langMenu.classList.remove("open");
        applyLangHighlight();
        renderStatic();
        if (lastDoc) renderData(lastDoc);
      });
    });
    function applyLangHighlight() {
      langMenu.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
    }

    function medalIcons(count) {
      if (!count) return "";
      if (count <= 3) return "🏅".repeat(count);
      return `<span class="medal-count-badge">🏅×${count}</span>`;
    }

    // ---------- build the static table skeleton ----------
    function renderStatic() {
      const t = T[lang];
      const table = document.getElementById("medalTable");

      let thead = `<thead>
        <tr class="zone-row">
          <th class="week-cell" rowspan="1">
            ${t.semaine} (<span id="weekNum">—</span>)<br/>
            ${t.du}: <span id="weekFrom">—</span><br/>
            ${t.au}: <span id="weekTo">—</span>
          </th>
          ${ZONES.map(z => `<th colspan="${TEAM_IDS.length}" data-zonelabel="${z}">${z}</th>`).join("")}
        </tr>
        <tr class="team-row">
          <th>${t.criteres}</th>
          ${ZONES.map(z => TEAM_IDS.map(id => `<th data-teamlabel="${z}_${id}">${t.equipe} ${id}</th>`).join("")).join("")}
        </tr>
      </thead>`;

      let tbody = "<tbody>";
      CRITERIA.forEach(critId => {
        tbody += `<tr>
          <td class="crit-cell">
            <span class="crit-title" data-crittitle="${critId}">${t["crit_" + critId + "_t"]}</span>
            <span class="crit-sub" data-critsub="${critId}">${t["crit_" + critId + "_s"]}</span>
          </td>
          ${ZONES.map(zone => TEAM_IDS.map(team => {
            const key = `${zone}_${team}_${critId}`;
            return `<td class="data-cell" data-key="${key}"></td>`;
          }).join("")).join("")}
        </tr>`;
      });
      tbody += `<tr class="total-row">
        <th>${t.totalMedailles}</th>
        ${ZONES.map(zone => TEAM_IDS.map(team => `<td data-total="${zone}_${team}">0</td>`).join("")).join("")}
      </tr></tbody>`;

      table.innerHTML = thead + tbody;

      document.getElementById("legendText").textContent = t.legend;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (t[key] !== undefined) el.textContent = t[key];
      });
      applyLangHighlight();
    }

    // ---------- fill in live data ----------
    let lastDoc = null;
    function renderData(data) {
      lastDoc = data;
      const t = T[lang];
      const week = data.week || {};
      document.getElementById("weekNum").textContent = week.number || "—";
      document.getElementById("weekFrom").textContent = week.from || "—";
      document.getElementById("weekTo").textContent = week.to || "—";

      // custom names override the translated defaults (textContent is XSS-safe either way)
      const cl = data.customLabels || {};
      ZONES.forEach(z => {
        const el = document.querySelector(`[data-zonelabel="${z}"]`);
        if (el) el.textContent = (cl.zones && cl.zones[z]) || z;
      });
      ZONES.forEach(zone => TEAM_IDS.forEach(id => {
        const key = `${zone}_${id}`;
        const el = document.querySelector(`[data-teamlabel="${key}"]`);
        if (el) el.textContent = (cl.teams && cl.teams[key]) || `${t.equipe} ${id}`;
      }));
      CRITERIA.forEach(critId => {
        const custom = cl.criteria && cl.criteria[critId];
        const titleEl = document.querySelector(`[data-crittitle="${critId}"]`);
        const subEl = document.querySelector(`[data-critsub="${critId}"]`);
        if (titleEl) titleEl.textContent = (custom && custom.title) || t["crit_" + critId + "_t"];
        if (subEl) subEl.textContent = (custom && custom.sub) || t["crit_" + critId + "_s"];
      });

      const medals = data.medals || {};
      ZONES.forEach(zone => TEAM_IDS.forEach(team => {
        let total = 0;
        CRITERIA.forEach(critId => {
          const key = `${zone}_${team}_${critId}`;
          const count = medals[key] || 0;
          total += count;
          const cell = document.querySelector(`[data-key="${key}"]`);
          if (cell) cell.innerHTML = `<span class="medal-icons">${medalIcons(count)}</span>`;
        });
        const totalCell = document.querySelector(`[data-total="${zone}_${team}"]`);
        if (totalCell) totalCell.textContent = total;
      }));

      const tow = data.teamOfWeek || {};
      const towTeamKey = tow.zone && tow.team ? `${tow.zone}_${tow.team}` : null;
      document.getElementById("towZone").textContent = tow.zone ? ((cl.zones && cl.zones[tow.zone]) || tow.zone) : "—";
      document.getElementById("towEquipe").textContent = towTeamKey
        ? ((cl.teams && cl.teams[towTeamKey]) || `${t.equipe} ${tow.team}`)
        : "—";
      document.getElementById("towTotal").textContent = tow.zone && tow.team
        ? `${(() => {
            let s = 0; CRITERIA.forEach(c => s += (medals[`${tow.zone}_${tow.team}_${c}`] || 0)); return s;
          })()} ${t.medaillesWord}`
        : "—";
      document.getElementById("towReward").textContent = tow.reward || "—";

      if (data.updatedAt) {
        const d = data.updatedAt.toDate ? data.updatedAt.toDate() : new Date(data.updatedAt);
        document.getElementById("updated").textContent = t.updated + d.toLocaleTimeString(lang === "fr" ? "fr-FR" : lang === "es" ? "es-ES" : "en-GB", { hour: "2-digit", minute: "2-digit" });
      }
    }

    renderStatic();

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, {
      localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
    });
    const ref = doc(db, DOC_PATH.collection, DOC_PATH.doc);

    onSnapshot(ref, (snap) => {
      renderData(snap.exists() ? snap.data() : {});
    }, (err) => {
      document.getElementById("updated").textContent = "Erreur / Error / Error";
      console.error(err);
    });
  </script>
</body>
</html>
