<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Admin — Tableau des Médailles</title>
<link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="wrap">

    <div class="topbar">
      <span class="status-line">
        <span class="live-dot"></span>
        <span id="updated">—</span>
      </span>

      <div style="display:flex;align-items:center;gap:8px;">
        <div class="lang-switch">
          <button class="gear-btn" id="gearBtn" title="Language">⚙️</button>

          <div class="lang-menu" id="langMenu">
            <button data-lang="fr">🇫🇷 Français</button>
            <button data-lang="en">🇬🇧 English</button>
            <button data-lang="es">🇪🇸 Español</button>
          </div>
        </div>

        <button
          id="logoutBtn"
          class="btn"
          style="display:none;padding:8px 12px;"
        >
          Logout
        </button>
      </div>
    </div>

    <!-- LOGIN -->
    <div id="loginBox" class="gate">
      <span class="big">🔐 Admin Login</span>

      <p id="loginMessage">
        Use the administrator Firebase account.
      </p>

      <div
        style="
          max-width:420px;
          margin:0 auto;
          display:grid;
          gap:10px;
          text-align:left;
        "
      >
        <input
          id="email"
          type="email"
          autocomplete="username"
          placeholder="Email"
          style="
            width:100%;
            padding:10px 12px;
            border:1px solid #DADAD6;
            border-radius:7px;
            font-family:inherit;
            font-size:14px;
          "
        />

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          style="
            width:100%;
            padding:10px 12px;
            border:1px solid #DADAD6;
            border-radius:7px;
            font-family:inherit;
            font-size:14px;
          "
        />

        <button
          id="loginBtn"
          class="btn"
          type="button"
        >
          Login
        </button>

        <p
          id="loginError"
          style="
            display:none;
            color:#B23A3A;
            font-size:13px;
            margin:0;
          "
        ></p>
      </div>
    </div>

    <!-- ADMIN APP -->
    <div id="app" style="display:none;">

      <div class="save-bar">
        <span id="saveStatus" class="save-status saved">
          ✅ Enregistré
        </span>

        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button id="clearAllBtn" class="btn danger">
            🗑 <span data-i18n="clearAll"></span>
          </button>

          <button id="saveBtn" class="btn" disabled>
            💾 <span data-i18n="save"></span>
          </button>
        </div>
      </div>

      <div class="medal-wrap">
        <table class="medal-table" id="medalTable"></table>
      </div>

      <!-- TEAM OF THE WEEK -->
      <div class="tow-panel">
        <div class="tow-head" data-i18n="equipeSemaine"></div>

        <div class="tow-body">

          <div class="tow-field">
            <label data-i18n="zone"></label>
            <select id="towZone">
              <option value="">—</option>
            </select>
          </div>

          <div class="tow-field">
            <label data-i18n="equipe"></label>
            <select id="towEquipe">
              <option value="">—</option>
            </select>
          </div>

          <div class="tow-field">
            <label data-i18n="total"></label>
            <span class="static-value" id="towTotal">—</span>
          </div>

          <div class="tow-field">
            <label data-i18n="recompense"></label>
            <input type="text" id="towReward" placeholder="..." />
          </div>

        </div>
      </div>

      <div class="legend-text" id="legendText"></div>

    </div>
  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";

    import {
      initializeFirestore,
      persistentLocalCache,
      persistentSingleTabManager,
      doc,
      onSnapshot,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    import {
      firebaseConfig,
      DOC_PATH
    } from "./firebase-config.js";


    const ZONES = [
      "VARIABLE",
      "BMB",
      "ENGEL"
    ];

    const TEAM_IDS = [
      "A",
      "B",
      "C",
      "D"
    ];

    const CRITERIA = [
      "trs",
      "valid",
      "presence",
      "org"
    ];


    const T = {

      fr: {
        semaine: "SEMAINE",
        du: "DU",
        au: "AU",
        criteres: "CRITÈRES",
        equipe: "Équipe",
        totalMedailles: "TOTAL MÉDAILLES",
        equipeSemaine: "ÉQUIPE DE LA SEMAINE",
        zone: "Zone :",
        recompense: "Récompense :",
        total: "Total :",
        medaillesWord: "médailles",

        save: "Enregistrer et envoyer",
        clearAll: "Tout effacer",

        savedMsg: "✅ Enregistré",
        unsavedMsg: "⚠️ Modifications non enregistrées",
        syncingMsg: "🔄 Synchronisation...",

        crit_trs_t: "TRS ≥ 75 %",
        crit_trs_s: "Plus de 75 % = 1 médaille",

        crit_valid_t: "Validations machines",
        crit_valid_s: "Validation réussie = 1 médaille",

        crit_presence_t: "Présence / Assiduité",
        crit_presence_s: "Moins de 5 absences par équipe = 1 médaille",

        crit_org_t: "5S & Organisation",
        crit_org_s: "Zone conforme + 0 fiche AC = 1 médaille",

        legend:
          "Cliquez + / − pour ajouter ou retirer une médaille. Le petit × efface une case. Le total se calcule automatiquement.",

        weekNumPh: "N°",

        updated: "Dernier enregistrement : ",

        confirmClearAll:
          "Effacer TOUTES les médailles de toutes les équipes ? Cette action ne peut être annulée qu'en resauvegardant."
      },


      en: {
        semaine: "WEEK",
        du: "FROM",
        au: "TO",
        criteres: "CRITERIA",
        equipe: "Team",
        totalMedailles: "TOTAL MEDALS",
        equipeSemaine: "TEAM OF THE WEEK",
        zone: "Zone:",
        recompense: "Reward:",
        total: "Total:",
        medaillesWord: "medals",

        save: "Save and send",
        clearAll: "Clear all",

        savedMsg: "✅ Saved",
        unsavedMsg: "⚠️ Unsaved changes",
        syncingMsg: "🔄 Syncing...",

        crit_trs_t: "OEE ≥ 75 %",
        crit_trs_s: "Over 75 % = 1 medal",

        crit_valid_t: "Machine validations",
        crit_valid_s: "Successful validation = 1 medal",

        crit_presence_t: "Attendance",
        crit_presence_s: "Fewer than 5 absences per team = 1 medal",

        crit_org_t: "5S & Organization",
        crit_org_s: "Compliant area + 0 non-conformity = 1 medal",

        legend:
          "Tap + / − to add or remove a medal. The small × clears a cell. The total is calculated automatically.",

        weekNumPh: "No.",

        updated: "Last saved: ",

        confirmClearAll:
          "Clear ALL medals for every team? This can only be undone by not saving."
      },


      es: {
        semaine: "SEMANA",
        du: "DEL",
        au: "AL",
        criteres: "CRITERIOS",
        equipe: "Equipo",
        totalMedailles: "TOTAL MEDALLAS",
        equipeSemaine: "EQUIPO DE LA SEMANA",
        zone: "Zona:",
        recompense: "Recompensa:",
        total: "Total:",
        medaillesWord: "medallas",

        save: "Guardar y enviar",
        clearAll: "Borrar todo",

        savedMsg: "✅ Guardado",
        unsavedMsg: "⚠️ Cambios sin guardar",
        syncingMsg: "🔄 Sincronizando...",

        crit_trs_t: "TRS ≥ 75 %",
        crit_trs_s: "Más de 75 % = 1 medalla",

        crit_valid_t: "Validaciones de máquina",
        crit_valid_s: "Validación exitosa = 1 medalla",

        crit_presence_t: "Asistencia",
        crit_presence_s: "Menos de 5 ausencias por equipo = 1 medalla",

        crit_org_t: "5S y Organización",
        crit_org_s: "Zona conforme + 0 ficha AC = 1 medalla",

        legend:
          "Toque + / − para añadir o quitar una medalla. El × pequeño borra una casilla. El total se calcula automáticamente.",

        weekNumPh: "N.º",

        updated: "Último guardado: ",

        confirmClearAll:
          "¿Borrar TODAS las medallas de todos los equipos? Solo se puede deshacer si no guarda."
      }

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = initializeFirestore(app, {
      localCache: persistentLocalCache({
        tabManager: persistentSingleTabManager()
      })
    });

    const ref = doc(
      db,
      DOC_PATH.collection,
      DOC_PATH.doc
    );


    const loginBox =
      document.getElementById("loginBox");

    const appBox =
      document.getElementById("app");

    const loginBtn =
      document.getElementById("loginBtn");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const loginError =
      document.getElementById("loginError");


    let unsubscribeSnapshot = null;

    let lang =
      localStorage.getItem("lang") || "fr";

    let workingDoc = {
      week: {
        number: "",
        from: "",
        to: ""
      },

      medals: {},

      teamOfWeek: {
        zone: "",
        team: "",
        reward: ""
      },

      customLabels: {
        zones: {},
        teams: {},
        criteria: {}
      }
    };

    let dirty = false;


    function escapeHtml(str) {

      return String(str ?? "")
        .replace(/[&<>"']/g, (ch) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[ch]));

    }


    function medalIcons(count) {

      if (!count) return "";

      if (count <= 3)
        return "🏅".repeat(count);

      return `<span class="medal-count-badge">🏅×${count}</span>`;

    }


    function setDirty(state) {

      dirty = state;

      const saveBtn =
        document.getElementById("saveBtn");

      const saveStatus =
        document.getElementById("saveStatus");

      saveBtn.disabled = !state;

      const t = T[lang];

      saveStatus.textContent =
        state ? t.unsavedMsg : t.savedMsg;

      saveStatus.className =
        "save-status " +
        (state ? "unsaved" : "saved");

    }


    const gearBtn =
      document.getElementById("gearBtn");

    const langMenu =
      document.getElementById("langMenu");


    gearBtn.addEventListener("click", () => {
      langMenu.classList.toggle("open");
    });


    document.addEventListener("click", (e) => {

      if (!e.target.closest(".lang-switch"))
        langMenu.classList.remove("open");

    });


    langMenu
      .querySelectorAll("button")
      .forEach(btn => {

        btn.addEventListener("click", () => {

          lang = btn.dataset.lang;

          localStorage.setItem("lang", lang);

          langMenu.classList.remove("open");

          applyLangHighlight();

          renderStatic();

          fillFromWorkingDoc();

        });

      });


    function applyLangHighlight() {

      langMenu
        .querySelectorAll("button")
        .forEach(b => {

          b.classList.toggle(
            "active",
            b.dataset.lang === lang
          );

        });

    }


    function renderStatic() {

      const t = T[lang];

      const table =
        document.getElementById("medalTable");

      const cl =
        workingDoc.customLabels || {
          zones: {},
          teams: {},
          criteria: {}
        };


      let thead = `<thead>

        <tr class="zone-row">

          <th class="week-cell">

            ${t.semaine}
            (<input
              type="text"
              id="weekNum"
              placeholder="${t.weekNumPh}"
              style="width:34px;"
            />)

            <br/>

            ${t.du}:
            <input type="date" id="weekFrom" />

            <br/>

            ${t.au}:
            <input type="date" id="weekTo" />

          </th>


          ${ZONES.map(z => `
            <th colspan="${TEAM_IDS.length}">

              <input
                class="name-edit-inline"
                data-zonekey="${z}"
                placeholder="${z}"
                value="${escapeHtml(cl.zones?.[z] || "")}"
              />

            </th>
          `).join("")}

        </tr>


        <tr class="team-row">

          <th>${t.criteres}</th>

          ${ZONES.map(z =>
            TEAM_IDS.map(id => {

              const key = `${z}_${id}`;

              return `
                <th>

                  <input
                    class="name-edit-inline small"
                    data-teamkey="${key}"
                    placeholder="${t.equipe} ${id}"
                    value="${escapeHtml(cl.teams?.[key] || "")}"
                  />

                </th>
              `;

            }).join("")
          ).join("")}

        </tr>

      </thead>`;


      let tbody = "<tbody>";


      CRITERIA.forEach(critId => {

        const custTitle =
          cl.criteria?.[critId]?.title || "";

        const custSub =
          cl.criteria?.[critId]?.sub || "";


        tbody += `<tr>

          <td class="crit-cell">

            <input
              class="crit-title-input"
              data-crittitle="${critId}"
              placeholder="${escapeHtml(
                t["crit_" + critId + "_t"]
              )}"
              value="${escapeHtml(custTitle)}"
            />

            <input
              class="crit-sub-input"
              data-critsub="${critId}"
              placeholder="${escapeHtml(
                t["crit_" + critId + "_s"]
              )}"
              value="${escapeHtml(custSub)}"
            />

          </td>


          ${ZONES.map(zone =>
            TEAM_IDS.map(team => {

              const key =
                `${zone}_${team}_${critId}`;

              return `
                <td
                  class="data-cell editable"
                  data-key="${key}"
                >

                  <button
                    class="cell-clear"
                    data-clear="${key}"
                    title="clear"
                  >
                    ×
                  </button>

                  <div class="medal-cell-inner">

                    <button
                      class="mstep minus"
                      data-minus="${key}"
                    >
                      −
                    </button>

                    <span
                      class="medal-icons"
                      data-icons="${key}"
                    ></span>

                    <button
                      class="mstep plus"
                      data-plus="${key}"
                    >
                      +
                    </button>

                  </div>

                </td>
              `;

            }).join("")
          ).join("")}

        </tr>`;

      });


      tbody += `<tr class="total-row">

        <th>${t.totalMedailles}</th>

        ${ZONES.map(zone =>
          TEAM_IDS.map(team => `
            <td
              data-total="${zone}_${team}"
            >
              0
            </td>
          `).join("")
        ).join("")}

      </tr></tbody>`;


      table.innerHTML =
        thead + tbody;


      table
        .querySelectorAll("[data-plus]")
        .forEach(b =>
          b.addEventListener("click", () =>
            bumpMedal(
              b.dataset.plus,
              1
            )
          )
        );


      table
        .querySelectorAll("[data-minus]")
        .forEach(b =>
          b.addEventListener("click", () =>
            bumpMedal(
              b.dataset.minus,
              -1
            )
          )
        );


      table
        .querySelectorAll("[data-clear]")
        .forEach(b =>
          b.addEventListener("click", () =>
            clearCell(
              b.dataset.clear
            )
          )
        );


      table
        .querySelectorAll("[data-zonekey]")
        .forEach(inp =>
          inp.addEventListener("input", () => {

            workingDoc.customLabels.zones[
              inp.dataset.zonekey
            ] = inp.value;

            setDirty(true);

          })
        );


      table
        .querySelectorAll("[data-teamkey]")
        .forEach(inp =>
          inp.addEventListener("input", () => {

            workingDoc.customLabels.teams[
              inp.dataset.teamkey
            ] = inp.value;

            setDirty(true);

            refreshTeamOfWeekOptions();

          })
        );


      table
        .querySelectorAll("[data-crittitle]")
        .forEach(inp =>
          inp.addEventListener("input", () => {

            workingDoc.customLabels.criteria[
              inp.dataset.crittitle
            ] = {
              ...(
                workingDoc.customLabels.criteria[
                  inp.dataset.crittitle
                ] || {}
              ),

              title: inp.value
            };

            setDirty(true);

          })
        );


      table
        .querySelectorAll("[data-critsub]")
        .forEach(inp =>
          inp.addEventListener("input", () => {

            workingDoc.customLabels.criteria[
              inp.dataset.critsub
            ] = {
              ...(
                workingDoc.customLabels.criteria[
                  inp.dataset.critsub
                ] || {}
              ),

              sub: inp.value
            };

            setDirty(true);

          })
        );


      document
        .getElementById("weekNum")
        .addEventListener("input", (e) => {

          workingDoc.week.number =
            e.target.value;

          setDirty(true);

        });


      document
        .getElementById("weekFrom")
        .addEventListener("input", (e) => {

          workingDoc.week.from =
            e.target.value;

          setDirty(true);

        });


      document
        .getElementById("weekTo")
        .addEventListener("input", (e) => {

          workingDoc.week.to =
            e.target.value;

          setDirty(true);

        });


      refreshTeamOfWeekOptions();


      document
        .getElementById("towZone")
        .addEventListener("change", (e) => {

          workingDoc.teamOfWeek.zone =
            e.target.value;

          workingDoc.teamOfWeek.team = "";

          setDirty(true);

          refreshTeamOfWeekOptions();

          syncTowTotalIfSelected();

        });


      document
        .getElementById("towEquipe")
        .addEventListener("change", (e) => {

          workingDoc.teamOfWeek.team =
            e.target.value;

          setDirty(true);

          syncTowTotalIfSelected();

        });


      document
        .getElementById("towReward")
        .addEventListener("input", (e) => {

          workingDoc.teamOfWeek.reward =
            e.target.value;

          setDirty(true);

        });


      document.getElementById(
        "legendText"
      ).textContent = t.legend;


      document
        .querySelectorAll("[data-i18n]")
        .forEach(el => {

          const key =
            el.getAttribute("data-i18n");

          if (t[key] !== undefined)
            el.textContent = t[key];

        });


      applyLangHighlight();

    }


    function refreshTeamOfWeekOptions() {

      const t = T[lang];

      const cl =
        workingDoc.customLabels || {};

      const zoneSel =
        document.getElementById("towZone");

      const equipeSel =
        document.getElementById("towEquipe");


      const selectedZone =
        workingDoc.teamOfWeek.zone ||
        zoneSel.value ||
        "";


      zoneSel.innerHTML =
        `<option value="">—</option>` +
        ZONES.map(z => `
          <option value="${z}">
            ${escapeHtml(
              cl.zones?.[z] || z
            )}
          </option>
        `).join("");


      zoneSel.value =
        selectedZone;


      const currentTeam =
        workingDoc.teamOfWeek.team || "";


      equipeSel.innerHTML =
        `<option value="">—</option>` +
        TEAM_IDS.map(id => {

          const key =
            `${selectedZone}_${id}`;

          return `
            <option value="${id}">
              ${escapeHtml(
                (cl.teams && cl.teams[key]) ||
                (t.equipe + " " + id)
              )}
            </option>
          `;

        }).join("");


      equipeSel.value =
        currentTeam;

    }


    function bumpMedal(key, delta) {

      const current =
        workingDoc.medals[key] || 0;

      workingDoc.medals[key] =
        Math.max(0, current + delta);

      setDirty(true);

      updateCell(key);

      const [zone, team] =
        key.split("_");

      updateTotalFor(
        zone,
        team
      );

      syncTowTotalIfSelected();

    }


    function clearCell(key) {

      workingDoc.medals[key] = 0;

      setDirty(true);

      updateCell(key);

      const [zone, team] =
        key.split("_");

      updateTotalFor(
        zone,
        team
      );

      syncTowTotalIfSelected();

    }


    function updateCell(key) {

      const iconsEl =
        document.querySelector(
          `[data-icons="${key}"]`
        );

      const count =
        workingDoc.medals[key] || 0;


      if (iconsEl)
        iconsEl.innerHTML =
          medalIcons(count);


      const minusBtn =
        document.querySelector(
          `[data-minus="${key}"]`
        );


      if (minusBtn)
        minusBtn.disabled =
          count === 0;

    }


    function updateTotalFor(zone, team) {

      let total = 0;


      CRITERIA.forEach(c => {

        total +=
          workingDoc.medals[
            `${zone}_${team}_${c}`
          ] || 0;

      });


      const cell =
        document.querySelector(
          `[data-total="${zone}_${team}"]`
        );


      if (cell)
        cell.textContent = total;

    }


    function syncTowTotalIfSelected() {

      const t = T[lang];

      const {
        zone,
        team
      } = workingDoc.teamOfWeek;


      if (zone && team) {

        let total = 0;


        CRITERIA.forEach(c => {

          total +=
            workingDoc.medals[
              `${zone}_${team}_${c}`
            ] || 0;

        });


        document.getElementById(
          "towTotal"
        ).textContent =
          `${total} ${t.medaillesWord}`;

      } else {

        document.getElementById(
          "towTotal"
        ).textContent = "—";

      }

    }


    function fillFromWorkingDoc() {

      const w =
        workingDoc.week || {};


      const weekNum =
        document.getElementById("weekNum");

      const weekFrom =
        document.getElementById("weekFrom");

      const weekTo =
        document.getElementById("weekTo");


      if (weekNum)
        weekNum.value =
          w.number || "";


      if (weekFrom)
        weekFrom.value =
          w.from || "";


      if (weekTo)
        weekTo.value =
          w.to || "";


      ZONES.forEach(zone =>
        TEAM_IDS.forEach(team => {

          CRITERIA.forEach(critId =>
            updateCell(
              `${zone}_${team}_${critId}`
            )
          );

          updateTotalFor(
            zone,
            team
          );

        })
      );


      const tow =
        workingDoc.teamOfWeek || {};


      refreshTeamOfWeekOptions();


      const towZone =
        document.getElementById("towZone");

      const towEquipe =
        document.getElementById("towEquipe");

      const towReward =
        document.getElementById("towReward");


      if (towZone)
        towZone.value =
          tow.zone || "";


      workingDoc.teamOfWeek.team =
        tow.team || "";


      refreshTeamOfWeekOptions();


      if (towEquipe)
        towEquipe.value =
          tow.team || "";


      if (towReward)
        towReward.value =
          tow.reward || "";


      syncTowTotalIfSelected();

    }


    /* LOGIN */

    loginBtn.addEventListener(
      "click",
      async () => {

        loginError.style.display =
          "none";


        const email =
          document.getElementById(
            "email"
          ).value.trim();


        const password =
          document.getElementById(
            "password"
          ).value;


        if (!email || !password) {

          loginError.textContent =
            "Enter email and password.";

          loginError.style.display =
            "block";

          return;

        }


        loginBtn.disabled = true;


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

        } catch (error) {

          console.error(error);

          loginError.textContent =
            "Login failed. Check your email/password.";

          loginError.style.display =
            "block";

        } finally {

          loginBtn.disabled = false;

        }

      }
    );


    /* LOGOUT */

    logoutBtn.addEventListener(
      "click",
      () => signOut(auth)
    );


    /* CLEAR ALL */

    document
      .getElementById("clearAllBtn")
      .addEventListener("click", () => {

        const t = T[lang];


        if (
          !confirm(
            t.confirmClearAll
          )
        )
          return;


        workingDoc.medals = {};

        setDirty(true);


        ZONES.forEach(zone =>
          TEAM_IDS.forEach(team => {

            CRITERIA.forEach(
              critId =>
                updateCell(
                  `${zone}_${team}_${critId}`
                )
            );

            updateTotalFor(
              zone,
              team
            );

          })
        );


        syncTowTotalIfSelected();

      });


    /* SAVE */

    document
      .getElementById("saveBtn")
      .addEventListener(
        "click",
        async () => {

          const t = T[lang];


          if (!auth.currentUser)
            return;


          const payload = {
            ...workingDoc,
            updatedAt:
              serverTimestamp()
          };


          setDirty(false);


          document.getElementById(
            "saveStatus"
          ).textContent =
            t.syncingMsg;


          document.getElementById(
            "saveStatus"
          ).className =
            "save-status unsaved";


          try {

            await setDoc(
              ref,
              payload
            );


            if (!dirty) {

              document.getElementById(
                "saveStatus"
              ).textContent =
                t.savedMsg;

              document.getElementById(
                "saveStatus"
              ).className =
                "save-status saved";

            }

          } catch (err) {

            console.error(err);

            alert(
              "Error saving. Check Firestore Rules and your admin account."
            );

            setDirty(true);

          }

        }
      );


    /* AUTH STATE */

    onAuthStateChanged(
      auth,
      (user) => {

        if (unsubscribeSnapshot) {

          unsubscribeSnapshot();

          unsubscribeSnapshot = null;

        }


        if (!user) {

          loginBox.style.display =
            "block";

          appBox.style.display =
            "none";

          logoutBtn.style.display =
            "none";

          return;

        }


        loginBox.style.display =
          "none";

        appBox.style.display =
          "block";

        logoutBtn.style.display =
          "inline-block";


        renderStatic();


        unsubscribeSnapshot =
          onSnapshot(
            ref,
            (snap) => {

              const data =
                snap.exists()
                  ? snap.data()
                  : {};


              if (!dirty) {

                workingDoc = {

                  week:
                    data.week || {
                      number: "",
                      from: "",
                      to: ""
                    },

                  medals:
                    data.medals || {},

                  teamOfWeek:
                    data.teamOfWeek || {
                      zone: "",
                      team: "",
                      reward: ""
                    },

                  customLabels:
                    data.customLabels || {
                      zones: {},
                      teams: {},
                      criteria: {}
                    }

                };


                renderStatic();

                fillFromWorkingDoc();

              }


              if (data.updatedAt) {

                const d =
                  data.updatedAt.toDate
                    ? data.updatedAt.toDate()
                    : new Date(
                        data.updatedAt
                      );


                document.getElementById(
                  "updated"
                ).textContent =
                  T[lang].updated +
                  d.toLocaleTimeString(
                    "fr-FR",
                    {
                      hour: "2-digit",
                      minute: "2-digit"
                    }
                  );

              }

            },


            (err) => {

              console.error(err);

              document.getElementById(
                "updated"
              ).textContent =
                "Firestore permission error";

            }
          );

      }
    );

  </script>

</body>
</html>
